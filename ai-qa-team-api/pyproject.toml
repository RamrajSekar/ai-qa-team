[project]
name = "ai-qa-team-api"
version = "0.1.0"
description = "FastAPI backend for AI QA Team platform"
authors = [
    {name = "Ramraj Sekar"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.121.1,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "pymongo (>=4.15.3,<5.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "redis (>=7.0.1,<8.0.0)",
    "openai (>=2.7.1,<3.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "pydantic[email] (>=2.12.4,<3.0.0)",
    "pydantic-settings==2.11.0",
    "certifi==2025.10.5",
    "httpx==0.28.1",
    "robotframework==7.5",
    "pillow==12.0.0",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "celery (>=5.5.3,<6.0.0)",
    "authlib (>=1.6.5,<2.0.0)",
    "passlib (==1.7.4)",
    "bcrypt (==3.2.2)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "playwright (>=1.56.0,<2.0.0)",
    "poetry-plugin-export (>=1.9.0,<2.0.0)",
]

[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
