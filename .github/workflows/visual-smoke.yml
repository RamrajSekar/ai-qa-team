name: Visual runner smoke check

on:
  push:
    branches: [codex/m1a-codespace-smoke]
    paths:
      - ".github/workflows/visual-smoke.yml"
      - "visual-runner/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build isolated Linux runner
        run: |
          docker build --platform linux/amd64 \
            --file visual-runner/linux/Dockerfile \
            --tag ai-qa-visual-smoke:ci visual-runner

      - name: Run controlled browser smoke check
        id: smoke
        run: |
          docker run --name ai-qa-visual-smoke \
            --network none --shm-size 512m --memory 2g --cpus 2 --pids-limit 256 \
            --mount source=ai-qa-visual-smoke-output,target=/output \
            ai-qa-visual-smoke:ci

      - name: Collect smoke evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/visual-smoke"
          mkdir -p "$evidence"
          if docker container inspect ai-qa-visual-smoke > /dev/null 2>&1; then
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' \
              ai-qa-visual-smoke | tee "$evidence/container-state.txt"
            docker logs ai-qa-visual-smoke > "$evidence/container.log" 2>&1
            docker cp ai-qa-visual-smoke:/output/. "$evidence/"
          fi

      - name: Probe Chrome startup after smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          evidence="$RUNNER_TEMP/visual-smoke"
          mkdir -p "$evidence"
          if docker run --rm \
            --network none --shm-size 512m --memory 2g --cpus 2 --pids-limit 256 \
            --entrypoint /bin/sh ai-qa-visual-smoke:ci -c '
              set -eu
              ulimit -c 0
              chrome=/opt/cft/chrome-linux64/chrome
              id
              "$chrome" --version
              printf "AppArmor label: "
              cat /proc/self/attr/apparmor/current 2>/dev/null || printf "unavailable\n"
              grep -E "^(NoNewPrivs|Seccomp|Seccomp_filters):" /proc/self/status || true
              if command -v unshare >/dev/null 2>&1; then
                if timeout --kill-after=2s 5s unshare -U true; then
                  printf "User namespace probe exit=0\n"
                else
                  printf "User namespace probe exit=%s\n" "$?"
                fi
              else
                printf "User namespace probe unavailable: unshare missing\n"
              fi
              ldd "$chrome" | awk "/not found/ { print; missing=1 } END { if (!missing) print \"No missing libraries reported by ldd\" }"
              profile=$(mktemp -d)
              if timeout --kill-after=5s 20s "$chrome" \
                --headless=new --user-data-dir="$profile" \
                --enable-logging=stderr --dump-dom about:blank \
                > "$profile/chrome.log" 2>&1; then
                result=0
              else
                result=$?
              fi
              printf "Chrome probe exit=%s\n" "$result"
              head -c 8192 "$profile/chrome.log"
              exit "$result"
            ' > "$evidence/chrome-probe.txt" 2>&1; then
            probe_exit=0
          else
            probe_exit=$?
          fi
          printf '\nProbe container exit=%s\n' "$probe_exit" >> "$evidence/chrome-probe.txt"
          cat "$evidence/chrome-probe.txt"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-evidence
          path: |
            ${{ runner.temp }}/visual-smoke/container-state.txt
            ${{ runner.temp }}/visual-smoke/container.log
            ${{ runner.temp }}/visual-smoke/chrome-probe.txt
            ${{ runner.temp }}/visual-smoke/*/state.json
            ${{ runner.temp }}/visual-smoke/*/01-open.png
            ${{ runner.temp }}/visual-smoke/*/02-filled.png
            ${{ runner.temp }}/visual-smoke/*/03-confirmed.png
          if-no-files-found: warn
          retention-days: 14

  native-smoke:
    name: Native Linux smoke experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CFT_VERSION: "146.0.7680.31"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Install pinned runner and browser pair
        run: |
          python -m pip install -r visual-runner/requirements.txt
          python -m pip check
          browser_root="$RUNNER_TEMP/cft-native"
          mkdir -p "$browser_root"
          for component in chrome chromedriver; do
            archive="$RUNNER_TEMP/$component-linux64.zip"
            curl --fail --location --proto '=https' --max-time 120 \
              "https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/linux64/$component-linux64.zip" \
              --output "$archive"
            unzip -q "$archive" -d "$browser_root"
          done
          "$browser_root/chrome-linux64/chrome" --version | grep -F "$CFT_VERSION"
          "$browser_root/chromedriver-linux64/chromedriver" --version | grep -F "$CFT_VERSION"
          cd visual-runner
          python -m linux.check_dependencies

      - name: Allow unprivileged user namespaces for Chrome
        run: |
          echo "before: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after:  $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          unshare -U true && echo "userns: ok" || { echo "userns: BLOCKED"; exit 1; }

      - name: Probe native Chrome with sandbox enabled
        id: native-probe
        run: |
          evidence="$RUNNER_TEMP/visual-smoke-native"
          mkdir -p "$evidence"
          profile=$(mktemp -d)
          trap 'rm -rf -- "$profile"' EXIT
          ulimit -c 0
          if timeout --kill-after=5s 20s "$RUNNER_TEMP/cft-native/chrome-linux64/chrome" \
            --headless=new --user-data-dir="$profile" --disable-background-networking \
            --proxy-server=http://127.0.0.1:9 '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1' \
            --enable-logging=stderr --dump-dom about:blank > "$profile/chrome.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          {
            printf 'Native Chrome probe exit=%s\n' "$result"
            head -c 8192 "$profile/chrome.log"
          } | tee "$evidence/chrome-probe.txt"
          exit "$result"

      - name: Compare native startup with Chrome sandbox disabled
        if: failure() && steps.native-probe.outcome == 'failure'
        run: |
          evidence="$RUNNER_TEMP/visual-smoke-native"
          profile=$(mktemp -d)
          trap 'rm -rf -- "$profile"' EXIT
          ulimit -c 0
          if timeout --kill-after=5s 20s "$RUNNER_TEMP/cft-native/chrome-linux64/chrome" \
            --headless=new --no-sandbox --user-data-dir="$profile" --disable-background-networking \
            --proxy-server=http://127.0.0.1:9 '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1' \
            --enable-logging=stderr --dump-dom about:blank > "$profile/chrome.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          {
            printf 'Native Chrome diagnostic (--no-sandbox) exit=%s\n' "$result"
            head -c 8192 "$profile/chrome.log"
          } | tee "$evidence/chrome-probe-no-sandbox.txt"

      - name: Run controlled browser smoke check natively
        working-directory: visual-runner
        run: |
          python -c 'import os; from pathlib import Path; from linux.entrypoint import main; temp = Path(os.environ["RUNNER_TEMP"]); main(output_root=temp / "visual-smoke-native", browser_root=temp / "cft-native")'

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-native-evidence
          path: |
            ${{ runner.temp }}/visual-smoke-native/chrome-probe.txt
            ${{ runner.temp }}/visual-smoke-native/chrome-probe-no-sandbox.txt
            ${{ runner.temp }}/visual-smoke-native/*/state.json
            ${{ runner.temp }}/visual-smoke-native/*/01-open.png
            ${{ runner.temp }}/visual-smoke-native/*/02-filled.png
            ${{ runner.temp }}/visual-smoke-native/*/03-confirmed.png
          if-no-files-found: warn
          retention-days: 14
