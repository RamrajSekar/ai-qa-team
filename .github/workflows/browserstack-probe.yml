name: BrowserStack synthetic probe

on:
  workflow_dispatch:
    inputs:
      visual_button:
        description: "Run one synthetic visual button experiment (uses one model call)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && !inputs.visual_button
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install -r visual-runner/requirements.txt
      - name: Exercise the synthetic form on BrowserStack
        working-directory: visual-runner
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python -m linux.browserstack_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserstack-fixture
          path: ${{ runner.temp }}/browserstack-fixture/*.png
          if-no-files-found: ignore
          retention-days: 7

  visual-button:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_button
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install -r visual-runner/requirements.txt Pillow==13.0.0
      - name: Locate and click the synthetic button
        working-directory: visual-runner
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -c 'from linux.browserstack_probe import main; main(visual=True)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserstack-visual-button
          path: ${{ runner.temp }}/browserstack-fixture/button-*.png
          if-no-files-found: ignore
          retention-days: 7
