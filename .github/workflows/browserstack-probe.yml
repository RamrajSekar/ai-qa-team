name: BrowserStack synthetic probe

on:
  push:
    branches: [codex/m1a-codespace-smoke]
    paths:
      - ".github/workflows/browserstack-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install -r visual-runner/requirements.txt
      - name: Open the synthetic fixture on BrowserStack
        working-directory: visual-runner
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python -m linux.browserstack_probe
      - uses: actions/upload-artifact@v4
        with:
          name: browserstack-fixture
          path: ${{ runner.temp }}/browserstack-fixture.png
          if-no-files-found: ignore
          retention-days: 7
